apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: alloy
  ports:
  - name: ui
    protocol: TCP
    port: 12345
    targetPort: 12345
  - name: otlp-grpc
    protocol: TCP
    port: 4317
    targetPort: 4317
  - name: otlp-http
    protocol: TCP
    port: 4318
    targetPort: 4318
  type: ClusterIP
