apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: jaeger
  ports:
  - name: ui
    protocol: TCP
    port: 16686
    targetPort: 16686
  - name: http-collector
    protocol: TCP
    port: 14268
    targetPort: 14268
  - name: otlp-grpc
    protocol: TCP
    port: 14250
    targetPort: 14250
  - name: otlp-grpc-alt
    protocol: TCP
    port: 4317
    targetPort: 4317
  - name: udp-legacy
    protocol: UDP
    port: 6831
    targetPort: 6831
  - name: udp-legacy-alt
    protocol: UDP
    port: 6832
    targetPort: 6832
  type: ClusterIP

