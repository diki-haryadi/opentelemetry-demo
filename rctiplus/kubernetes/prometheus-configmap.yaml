apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Values.namespace }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'alloy'
        static_configs:
          - targets: ['alloy:12345']

      - job_name: 'rctiplus-api'
        static_configs:
          - targets: ['rctiplus-app:8080']

      - job_name: 'tempo'
        static_configs:
          - targets: ['tempo:3200']

