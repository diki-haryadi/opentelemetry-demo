global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Note: Remote write receiver is enabled via docker-compose command:
# --web.enable-remote-write-receiver
# This allows Tempo to write metrics directly to Prometheus

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  - job_name: 'rctiplus-api'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: '/metrics'
    scrape_interval: 15s
