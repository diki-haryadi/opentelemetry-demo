global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: alloy-demo
    environment: production

# Enable exemplar storage for trace correlation
storage:
  exemplars:
    max_exemplars: 100000

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Alloy
  - job_name: 'alloy'
    static_configs:
      - targets: ['alloy:12345']

  # Scrape Tempo metrics
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # Scrape Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Scrape Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
